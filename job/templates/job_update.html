{% extends "base.html" %}
{% block title %}Update Job - JobPortal{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Update Job</h1>
</div>

<div class="card form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a class="btn btn-outline" href="{% url 'job_detail' object.pk %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
