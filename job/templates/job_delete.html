{% extends "base.html" %}
{% block title %}Delete Job - JobPortal{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Delete Job</h1>
</div>

<div class="card form-card">
    <p>Are you sure you want to delete the job: <strong>{{ object.title }}</strong>?</p>
    <p style="color:var(--muted); font-size:0.88rem;">This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a class="btn btn-outline" href="{% url 'job_detail' object.pk %}">No, Go Back</a>
        </div>
    </form>
</div>
{% endblock %}
